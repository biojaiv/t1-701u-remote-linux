# X on the tablet's framebuffer: no GPU, no udev, no virtual terminals
# (without /dev/tty0 the server opens no console, see xf86HasTTYs() in
# xorg-server 21.1 hw/xfree86/common/xf86Init.c). Generated for rotation
# "counterclockwise" by the project (linux/overlay); the session picks the file.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Device"
    Identifier "screen-buffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "on"
    Option "Rotate" "CCW"
EndSection

Section "Screen"
    Identifier "screen"
    Device "screen-buffer"
    DefaultDepth 24
EndSection

# goodix_ts: multitouch protocol A without slots and without ABS_X/ABS_Y.
# evdev ignores such a device ("ignoring absolute axes"); libinput takes it
# (mtdev, and evdev_fix_android_mt adds the missing axes). libinput needs the
# udev entry that mounts.sh writes.
Section "InputDevice"
    Identifier "touchscreen"
    Driver "libinput"
    Option "Device" "/dev/input/event3"
    Option "TransformationMatrix" "0 -1 1 1 0 0 0 0 1"
EndSection

Section "ServerLayout"
    Identifier "tablet"
    Screen "screen"
    InputDevice "touchscreen" "CorePointer"
EndSection
